#splash .lg{position:relative;width:176px;height:176px;animation:lgin 1s cubic-bezier(.2,1.3,.3,1) both}
#splash .lg img{width:100%;height:100%;border-radius:38px;box-shadow:0 0 60px #22d3ee88,0 0 120px #6366f155;animation:flo 2.4s ease-in-out infinite .9s}
#splash .ring{position:absolute;inset:-18px;border-radius:50%;border:2px solid transparent;border-top-color:#22d3ee;border-right-color:#6366f1;animation:spin 1.6s linear infinite}

#splash .shine{position:absolute;inset:0;border-radius:38px;overflow:hidden}
#splash .shine:after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shn 2.2s .8s ease-in-out infinite}
@keyframes shn{to{left:140%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lgin{0%{opacity:0;transform:scale(.3) rotate(-25deg);filter:blur(14px)}100%{opacity:1;transform:none;filter:none}}
@keyframes flo{50%{transform:translateY(-8px)}}
#splash .nm{margin-top:44px;font-weight:800;font-size:25px;letter-spacing:1px;display:flex;gap:1px;color:#e8ecff}
#splash .nm span{opacity:0;transform:translateY(16px);animation:ltr .5s forwards}
@keyframes ltr{to{opacity:1;transform:none}}
#splash .sb{margin-top:10px;font-size:12px;letter-spacing:5px;color:#22d3ee;opacity:0;animation:ltr .8s 1.9s forwards}
#splash .bar{position:absolute;bottom:60px;width:150px;height:3px;border-radius:3px;background:#ffffff1f;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#6366f1);animation:ld 2.4s ease-out forwards}
@keyframes ld{to{width:100%}}

/* ============ cloze generator (materials -> questions) ============ */
function genFromText(text,lang){
 const sents=text.split(/[\.\!\?؟؛\n]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=5);
 const stop=new Set('which their there these those about because between during through while where would could should other after before being using called known'.split(' '));
 const items=[];sents.forEach(s=>{const ws=s.split(/\s+/).map(w=>w.replace(/[^\p{L}\p{N}]/gu,'')).filter(w=>w.length>=4&&!stop.has(w.toLowerCase()));if(!ws.length)return;const k=ws.sort((a,b)=>b.length-a.length)[0];items.push({s,k})});
 const keys=[...new Set(items.map(i=>i.k))];const out=[];
 items.slice(0,12).forEach(it=>{let pool=keys.filter(k=>k!==it.k);while(pool.length<3)pool.push(rnd(['—','…','؟'])+pool.length);const d=shuffle(pool).slice(0,3);const opts=shuffle([it.k,...d]);const q=it.s.replace(it.k,'_____');const tier=it.k.length>=9?3:it.k.length>=7?2:1;
  out.push({cat:'mats',tier,type:'mc',q:{en:q,ar:q},o:{en:opts,ar:opts},a:opts.indexOf(it.k)})});return out}

 G.fb={ok:aOK,timeout,bOK,chalTxt,notes,correct:correctText(),who:p.name,whoB:Q.chal?o.name:null};G.reward=reward;G.done++;G.view='fb';renderGame();

 stage(`${sb()}<div class="card"><h3>⚡ ${tr('Speed Circle','دائرة السرعة')}</h3><p class="mut">${tr('10 questions in one minute. Pick the section.','١٠ أسئلة في دقيقة واحدة. اختر القسم.')}</p><div class="row"><button class="btn" onclick="runSpeed('q')">📖 القرآن</button><button class="btn" onclick="runSpeed('h')">📜 الحديث</button><button class="btn" onclick="runSpeed('a')">🕋 العقيدة</button><button class="btn" onclick="runSpeed('s')">🌙 السيرة</button></div></div>`);
}
function runSpeed(sec){const list=shuffle(SPEED[sec]);const seq=[];while(seq.length<10)seq.push(...shuffle(list));G.sp={seq:seq.slice(0,10),i:0,ok:0,bad:0,end:Date.now()+60000};G.view='speed';renderGame()}
function viewSpeed(){const s=G.sp;if(s.i>=10)return speedDone();const it=s.seq[s.i];
 stage(`${sb()}<div class="card"><div class="row"><span class="tag g">⚡ ${s.i+1}/10</span><span class="sp"></span><b id="tnum">60</b></div><div class="tb" style="margin:8px 0"><i id="tbar" style="width:100%"></i></div><div class="qc" dir="auto">${esc(it[0])}</div><div class="row"><button class="btn" style="flex:1" onclick="speedAns(1)">✔ صح</button><button class="btn alt" style="flex:1" onclick="speedAns(0)">✘ خطأ</button></div><p class="mut">✅ ${s.ok} · ❌ ${s.bad}</p></div>`);
 clearTimer();TM=setInterval(()=>{const left=(s.end-Date.now())/1000;const b=$('#tbar'),n=$('#tnum');if(b)b.style.width=Math.max(0,left/60*100)+'%';if(n)n.textContent=Math.max(0,Math.ceil(left));if(left<=0){clearTimer();speedDone()}},200)}
function speedAns(v){const s=G.sp;const ok=s.seq[s.i][1]===v;beep(ok?'ok':'no');ok?s.ok++:s.bad++;s.i++;viewSpeed()}
function speedDone(){clearTimer();const s=G.sp,p=P();const d=s.ok*100-s.bad*50;pts(p,d,tr('Speed circle','دائرة السرعة'));for(let i=0;i<s.ok;i++)addGenius(p.name);p.correct+=s.ok;G.done++;G.fb={ok:d>=0,notes:[(d>=0?'+':'−')+nf(Math.abs(d))],correct:`${s.ok}/10`,chalTxt:''};G.q={res:[],chal:null};G.reward=null;G.view='fb';renderGame()}
/* ---- Quran: abilities (human host) ---- */
function viewAbilPick(g){G.view='abil';G.abilSel=null;renderGame()}
function viewAbil(){const sel=G.abilSel;const p=P();
 if(!sel)return stage(`${sb()}<div class="card"><h3>🌟 ${tr('Abilities Circle','دائرة المواهب')}</h3><p class="mut">${tr('Scored by the human host. Value picked: ','يُقيَّم بواسطة المحاوِر البشري. القيمة المختارة: ')}${G.selVal}</p><div class="gates">${ABIL.map(a=>`<button class="gate" onclick="G.abilSel='${a.id}';viewAbil()"><div class="ic">${a.icon}</div><b>${a.n}</b></button>`).join('')}</div></div>`);
 const a=ABIL.find(x=>x.id===sel);
 stage(`${sb()}<div class="card"><h3>${a.icon} ${a.n}</h3><div class="qc" dir="auto">${a.p}</div><div class="badge">👤 ${tr('Human host scoring','تقييم المحاوِر البشري')}</div>${a.c.map((c,i)=>`<label class="l">${c} : <b id="sv${i}">5</b>/10</label><input type="range" min="0" max="10" value="5" oninput="$('#sv${i}').textContent=this.value">`).join('')}<div class="row" style="margin-top:14px"><button class="btn" onclick="abilDone(${a.c.length})">✔ ${tr('Confirm score','اعتماد الدرجة')}</button></div></div>`)}
function abilDone(n){let s=0;for(let i=0;i<n;i++)s+=+$('#sv'+i).textContent;const avg=s/n/10;const p=P();const g=Math.round(G.selVal*avg);pts(p,g,tr('Abilities (host)','المواهب (المحاوِر)'));G.done++;G.fb={ok:avg>=.5,notes:['+'+nf(g),`${Math.round(avg*100)}%`],correct:`${Math.round(avg*100)}%`,chalTxt:''};G.q={res:[],chal:null};G.reward=null;G.view='fb';renderGame()}

/* ---- equaliser ---- */
function startEq(r){G.eqRound=r;const pl=G.pool.filter(x=>x.type==='mc'&&x.cat!=='ai');const q=rnd(pl);const opts=shuffle(q.o[UI].map((t,i)=>({t,ok:i===q.a})));G.q={q,gate:null,val:500,tier:3,limit:30,opts,hidden:new Set(),seq:[0,1],step:0,res:[],eq:true,extra:0};G.view='q';toast('⚖️ '+tr('Tie! Equaliser round '+r,'تعادل! جولة الحسم '+r),2500);renderGame()}
function eqResolve(){const[r0,r1]=G.q.res;if(r0===r1){if(G.eqRound>=4){G.draw=true;return endGame()}return startEq(G.eqRound+1)}const w=r0?0:1;pts(G.players[w],500,tr('Equaliser','الحسم'));G.eqWin=w;endGame()}

async function llmRaw(content,max){
 if(!llmCfg().key&&SB.user)return SB.ai(content,max);
 const c=llmCfg(),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),170000);
 trace('llm.call',c.provider+' '+c.model);
 try{
  if(c.provider==='anthropic'){
   const r=await fetch(c.url||'https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:max||2000,messages:[{role:'user',content}]})});
   if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));const j=await r.json();return (j.content||[]).map(x=>x.text||'').join('')}
  let msg=content;if(Array.isArray(content))msg=content.map(b=>b.type==='text'?{type:'text',text:b.text}:b.type==='image'?{type:'image_url',image_url:{url:`data:${b.source.media_type};base64,${b.source.data}`}}:{type:'text',text:'[unsupported block]'});
  const r=await fetch(c.url||'https://api.openai.com/v1/chat/completions',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify({model:c.model,max_tokens:max||2000,messages:[{role:'user',content:msg}]})});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));const j=await r.json();return j.choices[0].message.content
 }finally{clearTimeout(to)}}
async function llmJSON(content,max){const t=await llmRaw(content,max);const a=t.search(/[\[{]/);if(a<0)throw new Error('no JSON');const open=t[a],close=open==='['?']':'}';const b=t.lastIndexOf(close);return JSON.parse(t.slice(a,b+1))}

const URL_PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',URL_PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',URL_ZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',URL_OCR='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';

const STYLEN={mcq:{en:'Multiple choice',ar:'اختيار من متعدد',icon:'🔘'},tf:{en:'True / False',ar:'صح / خطأ',icon:'⚖️'},fill:{en:'Type the answer',ar:'اكتب الإجابة',icon:'⌨️'},img:{en:'Picture questions',ar:'أسئلة مصوّرة',icon:'🖼️'}};
function genPrompt(o){return `You write quiz questions for a 2-player competition game.\nSubject: ${o.subject}.\nLanguage of the questions: ${o.lang==='ar'?'Arabic':'English'}.\nCreate ${o.n} questions${o.text?' ONLY from the material below, do not invent facts':''}. Styles to mix: ${o.styles||'mcq,tf,fill'}.\nReturn ONLY a JSON array. Each item: {"type":"mc"|"tf"|"typed","q":"question","options":["opt1","opt2","opt3","opt4"],"correct":<0-based index for mc, true/false for tf, omit for typed>,"answers":["accepted answers (typed only)"],"tier":1|2|3}\n${o.text?'MATERIAL:\n'+o.text.slice(0,12000):''}`}
const imgPrompt=sj=>`This image belongs to the subject "${sj?subjName(sj):'general'}". It may be Arabic or English and may contain ready-made quiz questions, a picture riddle or a diagram. Extract every question you find (keep the original language). If the picture itself is needed to answer (a picture riddle, an object to identify, a chart/diagram), set "useImage":true for that item. If the image has no ready questions, write 3 good questions about its content (set useImage:true when they depend on seeing it). Return ONLY a JSON array. Each item: {"type":"mc"|"tf"|"typed","q":"question","options":[...],"correct":<index or true/false>,"answers":[...],"tier":1|2|3,"useImage":true|false}`;
function mkQ(it,gate,img){if(!it||!it.q)return null;const q=String(it.q).trim();const tier=Math.min(3,Math.max(1,+it.tier||1));const ar=/[؀-ۿ]/.test(q);const base={cat:gate,tier,q:{en:q,ar:q}};if(it.explain)base.expl=String(it.explain);if(img&&it.useImage)base.img=img;
 if(it.type==='tf'||typeof it.correct==='boolean'){const t=ar?['صح','خطأ']:['True','False'];const truth=it.correct===true||/^(true|صح|صحيح)$/i.test(String(it.correct));return Object.assign(base,{type:'mc',o:{en:t,ar:t},a:truth?0:1})}
 if(it.type==='typed'||!Array.isArray(it.options)||it.options.length<2){const acc=(it.answers&&it.answers.length?it.answers:[it.correct]).filter(x=>x!=null&&x!=='').map(String);if(!acc.length)return null;return Object.assign(base,{type:'ty',acc:{en:acc,ar:acc}})}
 const opts=it.options.map(String);let a=typeof it.correct==='number'?it.correct:opts.findIndex(o=>norm(o)===norm(String(it.correct)));if(a<0||a>=opts.length)return null;const so=shuffle(opts.map((t,i)=>({t,ok:i===a})));return Object.assign(base,{type:'mc',o:{en:so.map(x=>x.t),ar:so.map(x=>x.t)},a:so.findIndex(x=>x.ok)})}
function parseQuestions(text){
 const lines=text.replace(/\r/g,'').split('\n').map(s=>s.replace(/[*_`#]/g,'').trim());const blocks=[];let cur=null,m,mode='';
 const D='0-9٠-٩';
 const qs=new RegExp('^(?:[Qq]\\s*['+D+']*|['+D+']+|س\\s*['+D+']*)\\s*[\\.\\):\\-－]\\s*(.+)'),qlab=/^(?:السؤال|سؤال|question)\s*[:：]\s*(.+)/i,
  op=/^\(?([A-Da-dأبجد])\s*[\.\)\-:]\s*(.+)/,
  an=/^(?:answer|correct answer|ans|الإجابة الصحيحة|الاجابة الصحيحة|الإجابة|الاجابة|الجواب الصحيح|الجواب)\s*[:：]\s*(.+)/i,
  ex=/^(?:لو أخطأت|إذا أخطأت|اذا اخطأت|لو غلطت|الشرح|التصحيح|شرح[^:：]{0,25}|تصحيح[^:：]{0,25}|explanation|if wrong|hint)[^:：]{0,25}[:：]\s*(.+)/i;
 const strip=q=>q.replace(/^(?:السؤال|سؤال|question)\s*[:：]\s*/i,'').trim();
 for(const l of lines){if(!l)continue;
  if(m=l.match(ex)){if(cur){cur.expl=m[1].trim();mode='e'}continue}
  if(m=l.match(an)){if(cur){cur.ans=m[1].trim();mode='a'}continue}
  if(cur&&(m=l.match(op))){cur.opts.push(m[2].trim());cur.keys.push(m[1].toLowerCase());mode='o';continue}
  if(m=l.match(qs)||l.match(qlab)){cur={q:strip(m[1]),opts:[],keys:[],ans:null,expl:''};blocks.push(cur);mode='q';continue}
  if(cur){if(mode==='e')cur.expl+=' '+l;else if(mode==='q'&&!cur.opts.length&&cur.ans==null)cur.q+=' '+l}}
 const out=[];blocks.forEach(b=>{if(b.ans==null)return;const a=b.ans;let it;
  if(b.opts.length>=2){const k=a.charAt(0).toLowerCase();let i=b.keys.indexOf(k);if(i<0||a.length>2&&!/^[A-Da-dأبجد][\.\)]?$/.test(a.trim()))i=b.opts.findIndex(o=>norm(o)===norm(a.replace(/^[A-Da-dأبجد][\.\)]\s*/,'')));if(i<0)return;it={type:'mc',q:b.q,options:b.opts,correct:i}}
  else if(/^(true|false|صح|خطأ|صحيح|خاطئ)$/i.test(a))it={type:'tf',q:b.q,correct:/^(true|صح|صحيح)$/i.test(a)};
  else{const ans=a.split(/[\/|،]/).map(x=>x.trim()).filter(Boolean);const nm=a.match(/^[0-9٠-٩][0-9٠-٩.,٫]*/);if(nm&&!ans.includes(nm[0]))ans.push(nm[0]);it={type:'typed',q:b.q,answers:ans}}
  if(b.expl)it.explain=b.expl.trim();out.push(it)});
 return out}
function imgData(f,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('bad image'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
async function ocr(url){await loadScript(URL_OCR);const r=await Tesseract.recognize(url,'ara+eng');return r.data.text}
async function pdfText(f){await loadScript(URL_PDF);pdfjsLib.GlobalWorkerOptions.workerSrc=URL_PDFW;const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=Math.min(d.numPages,40);i++){const pg=await d.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}return t}

function qbJudge(silent){

 });

async function qbToggleRev(id){const x=QB.items.find(i=>i.id===id);if(x.reviewed)delete x.reviewed;else x.reviewed=true;await qbPut([x]);qbJudge(true);qbView()}
async function qbDelete(id){if(!confirm(tr('Delete this question?','حذف هذا السؤال؟')))return;QB.items=QB.items.filter(i=>i.id!==id);await qbDel(id);qbJudge(true);qbView()}

function qbPaintRun(animate){const box=$('#qbrun');if(!box||!QB.items.length)return;const S=qbLanes(QB.report);let i=0;const one=()=>{if(i>=S.length)return;const s=S[i++];const el=document.createElement('div');el.className='step'+(animate?'':' done');el.innerHTML=`<span class="d">${animate?'<span class="spin"></span>':'✓'}</span><span>${esc(s[0])}<br><span class="mut" dir="ltr">› ${esc(s[1])}</span></span>`;box.appendChild(el);if(animate)setTimeout(()=>{el.classList.add('done');el.querySelector('.d').textContent='✓';one()},320);else one()};one()}

function dmRun(ctx){
 const t0=performance.now();const pool=ctx.pool,seen=new Set(),clean=[];let inval=0,dups=0;
 pool.forEach(q=>{let ok=true;const t=(q.q&&(q.q.en||q.q.ar))||'';
  if(q.type==='mc'){const o=q.o&&(q.o.en||q.o.ar);ok=Array.isArray(o)&&o.length>=2&&q.a>=0&&q.a<o.length&&new Set(o.map(qbKey)).size===o.length}
  else if(q.type==='ty'){const a=q.acc&&(q.acc.en||q.acc.ar);ok=Array.isArray(a)&&a.length>0}else ok=false;
  if(t.length<3)ok=false;if(!ok){inval++;return}
  const k=qbKey(t);if(q.cat!=='ai'&&seen.has(k)){dups++;return}seen.add(k);clean.push(q)});
 const L1={id:'content',icon:'🎯',title:{en:'Content accuracy',ar:'دقة المحتوى'},st:(inval||dups)?'warn':'ok',lines:[`${tr('kept','المقبول')}: ${clean.length}/${pool.length}`,`${tr('invalid removed','أسئلة معطوبة حُذفت')}: ${inval}`,`${tr('duplicates removed','مكررات حُذفت')}: ${dups}`,ctx.tid==='quran'||pool.some(q=>q.cat==='quran')?tr('Quran: only human-reviewed texts play','القرآن: لا تُلعب إلا النصوص المراجعة بشريًّا'):tr('Facts need review before public release','الحقائق تحتاج مراجعة قبل الإصدار العام')]};
 const hist={1:0,2:0,3:0};clean.forEach(q=>hist[q.tier||1]++);const miss=[1,2,3].filter(x=>!hist[x]);
 const L2={id:'ladder',icon:'📈',title:{en:'Difficulty ladder',ar:'سُلّم الصعوبة'},st:(miss.length&&ctx.o.dm!=='fixed'&&clean.length>=6)?'warn':'ok',lines:[`★ ${hist[1]} · ★★ ${hist[2]} · ★★★ ${hist[3]}`,`${tr('model','النموذج')}: ${ctx.o.dm}`,miss.length&&clean.length>=6?tr('Missing tier(s): '+miss.join(','),'مستويات ناقصة: '+miss.join('،'))+' → '+tr('nearest tier is used','يُستخدم أقرب مستوى'):tr('All tiers covered or not needed','المستويات مغطّاة أو غير مطلوبة')]};
 const turns=ctx.o.wc==='last'?60:ctx.rounds*2,by={};clean.forEach(q=>by[q.cat]=(by[q.cat]||0)+1);const thin=Object.keys(by).filter(c=>by[c]<3);

function lockCard(k){const f=FEAT[k],p=PLANS[f.t];return `<div class="card" style="text-align:center"><div class="big">🔒</div><h3>${f.i} ${esc(L(f))}</h3><p class="mut">${tr('Included in the','ضمن باقة')} ${p.icon} ${esc(L(p.n))}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('plans')">💎 ${tr('View plans','عرض الخطط')}</button><button class="btn alt" onclick="setPlan(${f.t});go('plans')">👁 ${tr('Preview','معاينة')}</button></div></div>`}
function pcard(p,cur){const own=Object.keys(FEAT).filter(k=>FEAT[k].t===p.id);const prev=p.id?PLANS[p.id-1]:null;
 return `<div class="pcard ${cur===p.id?'cur':''}"><div class="pic">${p.icon}</div><h3>${esc(L(p.n))}</h3><div style="font-weight:800;font-size:18px;margin:2px 0">${p.id?'🔒 '+tr('Premium','باقة مميزة'):tr('Free','مجانًا')}</div><div class="mut" style="min-height:34px">${esc(L(p.tag))}</div><div class="mut" style="font-size:12px;margin-top:2px">${esc(L(p.who))}</div>
 ${prev?`<div class="badge" style="margin:10px 0 4px">＋ ${tr('Everything in','كل ما في')} ${esc(L(prev.n))}</div>`:'<div style="height:10px"></div>'}
 <ul class="flist">${own.map(k=>`<li><span>${FEAT[k].i}</span><span>${esc(L(FEAT[k]))}${FEAT[k].soon?` <span class="tag p">🔜 ${tr('soon','قريبًا')}</span>`:''}</span></li>`).join('')}</ul>
 <button class="btn ${cur===p.id?'alt':''}" style="width:100%;margin-top:10px" onclick="setPlan(${p.id})">${cur===p.id?'✓ '+tr('Current preview','المعاينة الحالية'):tr('Preview this plan','معاينة هذه الباقة')}</button></div>`}

function qh(q){const s=(q.cat||'')+'|'+((q.q&&(q.q.en||q.q.ar))||'');let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const seenGet=()=>store('ga_seen_'+G.tid)||[];
const seenHas=q=>seenGet().includes(qh(q));
function seenAdd(q){const a=seenGet(),k=qh(q);if(!a.includes(k)){a.push(k);store('ga_seen_'+G.tid,a.slice(-1500))}}
function seenDel(q){const k=qh(q);store('ga_seen_'+G.tid,seenGet().filter(x=>x!==k))}
function resetSeen(){try{Object.keys(localStorage).filter(k=>k.startsWith('ga_seen_')).forEach(k=>localStorage.removeItem(k))}catch(e){}toast('♻️ '+tr('Question history cleared','تم مسح سجل الأسئلة'))}
