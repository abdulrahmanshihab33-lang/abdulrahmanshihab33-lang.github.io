<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOG Say the Color</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
    <style>
        html{background:#090a0f}
        body {
            font-family: 'Outfit', sans-serif;
            background: #090a0f;
            color: #f3f4f6;
            touch-action: manipulation;
        }

        .glow-bg {
            background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.15), rgba(15, 23, 42, 0) 70%);
        }

        .neon-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .btn-color-card {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-color-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-color-card:active {
            transform: translateY(1px) scale(0.98);
        }

        @keyframes pulse-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-1deg); }
            40% { transform: translateX(10px) rotate(1deg); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        .shake {
            animation: pulse-shake 0.35s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-4 glow-bg select-none overflow-x-hidden">

    <!-- Header / Branding -->
    <header class="text-center mb-6 max-w-lg w-full">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400">
            HOG SAY THE COLOR
        </h1>
        <p class="text-xs md:text-sm text-gray-400 font-semibold tracking-wider uppercase mt-1">
            Not the word! • Brain Reflex Challenge
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-lg relative">
        <div class="neon-card rounded-3xl p-6 md:p-8 relative overflow-hidden">
            
            <!-- HUD / Top Bar -->
            <div class="flex justify-between items-center mb-5 bg-slate-900/60 p-3.5 rounded-2xl border border-white/5">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Score</span>
                    <span id="score-display" class="text-2xl font-black text-cyan-400">0</span>
                </div>
                
                <div class="flex flex-col items-center">
                    <span id="streak-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 opacity-0 transition-opacity" style="opacity: 0;">
                        🔥 <span id="streak-count">0</span> Streak
                    </span>
                </div>

                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">High Score</span>
                    <span id="highscore-display" class="text-2xl font-black text-amber-400">0</span>
                </div>
            </div>

            <!-- Timer Progress Bar -->
            <div class="w-full bg-slate-800/80 h-3 rounded-full overflow-hidden mb-8 border border-white/5 relative">
                <div id="timer-bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 w-full transition-all duration-75" style="width: 100%;"></div>
            </div>

            <!-- Main Word Display Box -->
            <div class="min-h-[140px] flex items-center justify-center bg-slate-900/40 rounded-2xl border border-white/5 p-4 mb-8 shadow-inner">
                <span id="word-target" class="text-5xl md:text-6xl font-black tracking-wider text-center drop-shadow-md pop-in" style="color: rgb(249, 115, 22);">BLUE</span>
            </div>

            <!-- Color Options Grid -->
            <div id="options-grid" class="grid grid-cols-2 gap-3.5 mb-6"><button class="btn-color-card flex items-center justify-between p-4 rounded-2xl font-black text-lg text-white border border-white/10 relative overflow-hidden" style="background-color: rgb(168, 85, 247);">
                    <span class="drop-shadow-md">PURPLE</span>
                    <span class="hidden md:inline-block key-badge px-2 py-0.5 rounded text-xs text-white/80 font-mono font-bold">Q</span>
                </button><button class="btn-color-card flex items-center justify-between p-4 rounded-2xl font-black text-lg text-white border border-white/10 relative overflow-hidden" style="background-color: rgb(59, 130, 246);">
                    <span class="drop-shadow-md">BLUE</span>
                    <span class="hidden md:inline-block key-badge px-2 py-0.5 rounded text-xs text-white/80 font-mono font-bold">W</span>
                </button><button class="btn-color-card flex items-center justify-between p-4 rounded-2xl font-black text-lg text-white border border-white/10 relative overflow-hidden" style="background-color: rgb(239, 68, 68);">
                    <span class="drop-shadow-md">RED</span>
                    <span class="hidden md:inline-block key-badge px-2 py-0.5 rounded text-xs text-white/80 font-mono font-bold">A</span>
                </button><button class="btn-color-card flex items-center justify-between p-4 rounded-2xl font-black text-lg text-white border border-white/10 relative overflow-hidden" style="background-color: rgb(249, 115, 22);">
                    <span class="drop-shadow-md">ORANGE</span>
                    <span class="hidden md:inline-block key-badge px-2 py-0.5 rounded text-xs text-white/80 font-mono font-bold">S</span>
                </button></div>

            <!-- Keyboard Guide (Desktop) -->
            <div class="hidden md:flex justify-center items-center gap-4 text-xs text-gray-500 font-medium">
                <span>Keyboard controls:</span>
                <div class="flex gap-2">
                    <span class="key-badge px-2 py-0.5 rounded text-[11px] text-gray-300 font-bold">Q</span>
                    <span class="key-badge px-2 py-0.5 rounded text-[11px] text-gray-300 font-bold">W</span>
                    <span class="key-badge px-2 py-0.5 rounded text-[11px] text-gray-300 font-bold">A</span>
                    <span class="key-badge px-2 py-0.5 rounded text-[11px] text-gray-300 font-bold">S</span>
                </div>
            </div>

            <!-- Start / Game Over Overlay -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-3xl flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="mb-4">
                    <div id="overlay-icon" class="text-5xl mb-2">🎨</div>
                    <h2 id="overlay-title" class="text-2xl md:text-3xl font-black text-white">Say the Color!</h2>
                    <p id="overlay-subtitle" class="text-xs md:text-sm text-gray-400 max-w-xs mt-1">Tap the INK colour you see, not the word it spells!</p>
                </div>

                <!-- Difficulty Selector -->
                <div class="w-full max-w-xs mb-6">
                    <label class="block text-xs uppercase font-bold text-gray-400 mb-2 tracking-wider">Select Difficulty</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setDifficulty('easy')" id="diff-easy" class="diff-btn py-2 text-xs font-bold rounded-xl border border-cyan-500/50 bg-cyan-500/20 text-cyan-300 shadow-lg shadow-cyan-900/30">
                            Easy<br><span class="text-[10px] font-normal opacity-75">4.0s</span>
                        </button>
                        <button onclick="setDifficulty('medium')" id="diff-medium" class="diff-btn py-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/80 text-gray-400 hover:bg-slate-700">
                            Medium<br><span class="text-[10px] font-normal opacity-75">2.5s</span>
                        </button>
                        <button onclick="setDifficulty('hard')" id="diff-hard" class="diff-btn py-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/80 text-gray-400 hover:bg-slate-700">
                            Hard<br><span class="text-[10px] font-normal opacity-75">1.5s</span>
                        </button>
                    </div>
                </div>

                <!-- Last Score Stats (Game Over) -->
                <div id="last-stats" class="hidden grid grid-cols-2 gap-4 w-full max-w-xs mb-6 bg-slate-900/80 p-3 rounded-xl border border-white/5">
                    <div>
                        <div class="text-[10px] uppercase font-bold text-gray-400">Score</div>
                        <div id="last-score" class="text-xl font-black text-cyan-400">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-gray-400">Best</div>
                        <div id="last-best" class="text-xl font-black text-amber-400">0</div>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="start-btn" onclick="startGame()" class="w-full max-w-xs py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold rounded-2xl shadow-lg shadow-purple-900/40 transform active:scale-95 transition-all text-base tracking-wide">PLAY</button>
            </div>

        </div>
    </main>

    

    <!-- Game Logic & Web Audio Synthesizer -->
    <script>
        // Palette of High Contrast Stroop Colors
        const AR_ON = !!(window.HOG && window.HOG.lang==='ar');
        const AR_NAMES = {RED:'أحمر',BLUE:'أزرق',GREEN:'أخضر',YELLOW:'أصفر',PURPLE:'بنفسجي',ORANGE:'برتقالي'};
        const dn = n => AR_ON ? AR_NAMES[n] : n;
        const TX = (en,ar) => AR_ON ? ar : en;
        const COLOR_PALETTE = [
            { name: 'RED', hex: '#ef4444', key: 'Q' },
            { name: 'BLUE', hex: '#3b82f6', key: 'W' },
            { name: 'GREEN', hex: '#10b981', key: 'A' },
            { name: 'YELLOW', hex: '#eab308', key: 'S' },
            { name: 'PURPLE', hex: '#a855f7', key: 'D' },
            { name: 'ORANGE', hex: '#f97316', key: 'F' }
        ];

        // Difficulty Configuration (ms)
        const DIFFICULTY_SETTINGS = {
            easy: 4000,
            medium: 2500,
            hard: 1500
        };

        // Game State Variables
        let currentDifficulty = 'medium';
        let score = 0;
        let streak = 0;
        let highScore = 0; try{highScore = parseInt(localStorage.getItem('stroop_highscore') || '0', 10)||0;}catch(e){}
        let currentInkColor = null;
        let timerId = null;
        let startTime = 0;
        let isPlaying = false;
        let audioCtx = null;
        let currentOptions = [];

        // DOM Elements
        const wordTarget = document.getElementById('word-target');
        const optionsGrid = document.getElementById('options-grid');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const streakBadge = document.getElementById('streak-badge');
        const streakCount = document.getElementById('streak-count');
        const timerBar = document.getElementById('timer-bar');
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const overlayIcon = document.getElementById('overlay-icon');
        const startBtn = document.getElementById('start-btn');
        const lastStats = document.getElementById('last-stats');
        const lastScore = document.getElementById('last-score');
        const lastBest = document.getElementById('last-best');

        
        // ---- HOG hooks ----
        if (AR_ON) {
            document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
            const setT = (sel, t) => { const e = document.querySelector(sel); if (e) e.textContent = t; };
            setT('header h1', 'HOG قل اللون');
            setT('header p', 'لا تقل الكلمة! • تحدي سرعة البديهة');
            setT('#overlay-title', 'قل اللون!');
            setT('#overlay-subtitle', 'المس لون الحبر الذي تراه، لا الكلمة المكتوبة!');
            setT('#start-btn', 'ابدأ');
            const lab = document.querySelector('#game-overlay label'); if (lab) lab.textContent = 'اختر الصعوبة';
            const dm = {easy:'سهل', medium:'متوسط', hard:'صعب'};
            ['easy','medium','hard'].forEach(d => { const b = document.getElementById('diff-'+d); if (b) b.firstChild.textContent = dm[d]; });
        }

        // Initialize Highscore UI
        highscoreDisplay.textContent = highScore;
        updateDifficultyUI();

        // Audio Synthesizer via Web Audio API
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // Upward pleasant pitch
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'streak') {
                    // Fanfare synth chord burst
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); // A5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'wrong') {
                    // Harsh low buzzing tone
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                // Fail silently if browser blocks audio autoplay
            }
        }

        // Set Difficulty Mode
        function setDifficulty(diff) {
            if (isPlaying) return;
            currentDifficulty = diff;
            updateDifficultyUI();
        }

        function updateDifficultyUI() {
            ['easy', 'medium', 'hard'].forEach(diff => {
                const btn = document.getElementById(`diff-${diff}`);
                if (diff === currentDifficulty) {
                    btn.className = 'diff-btn py-2 text-xs font-bold rounded-xl border border-cyan-500/50 bg-cyan-500/20 text-cyan-300 shadow-lg shadow-cyan-900/30';
                } else {
                    btn.className = 'diff-btn py-2 text-xs font-bold rounded-xl border border-white/10 bg-slate-800/80 text-gray-400 hover:bg-slate-700';
                }
            });
        }

        // Start Game
        function startGame() {
            initAudio();
            score = 0;
            streak = 0;
            isPlaying = true;
            scoreDisplay.textContent = '0';
            streakBadge.style.opacity = '0';
            gameOverlay.classList.add('hidden');
            nextTurn();
        }

        // Game Over Trigger
        function gameOver(reason = 'wrong') {
            isPlaying = false;
            clearInterval(timerId);
            playSound('wrong');

            if (score > highScore) {
                highScore = score;
                try{localStorage.setItem('stroop_highscore', highScore.toString());}catch(e){}
                highscoreDisplay.textContent = highScore;
            }

            // Visual feedbackshake
            wordTarget.parentElement.classList.add('shake');
            setTimeout(() => wordTarget.parentElement.classList.remove('shake'), 400);

            // Update Overlay Content
            overlayIcon.textContent = reason === 'timeout' ? '⏰' : '❌';
            overlayTitle.textContent = reason === 'timeout' ? TX('Time Ran Out!','انتهى الوقت!') : TX('Wrong Color!','لون خاطئ!');
            overlaySubtitle.textContent = reason === 'timeout' ? TX('You must act faster!','كن أسرع!') : TX('Remember to tap the visual INK color, not the word!','المس لون الحبر الذي تراه، لا الكلمة المكتوبة!');
            
            if (window.HOG && score >= 8) { try { parent.postMessage({hogdone: window.HOG.id || 'hog-say-color', stars: score >= 30 ? 3 : score >= 18 ? 2 : 1}, '*'); } catch(e){} }
            lastScore.textContent = score;
            lastBest.textContent = highScore;
            lastStats.classList.remove('hidden');

            startBtn.textContent = TX('TRY AGAIN','حاول مجددًا');
            gameOverlay.classList.remove('hidden');
        }

        // Generate Next Round Question
        function nextTurn() {
            clearInterval(timerId);

            // Select Target Ink Color and Text Word (Ensuring Stroop Conflict)
            const inkIndex = Math.floor(Math.random() * COLOR_PALETTE.length);
            let textIndex;
            do {
                textIndex = Math.floor(Math.random() * COLOR_PALETTE.length);
            } while (textIndex === inkIndex);

            currentInkColor = COLOR_PALETTE[inkIndex];
            const textWord = COLOR_PALETTE[textIndex];

            // Render Target Text
            wordTarget.textContent = dn(textWord.name);
            wordTarget.style.color = currentInkColor.hex;
            
            // Pop-in animation reset
            wordTarget.classList.remove('pop-in');
            void wordTarget.offsetWidth; // Trigger reflow
            wordTarget.classList.add('pop-in');

            // Select 4 choices (including correct answer)
            let remaining = COLOR_PALETTE.filter(c => c.name !== currentInkColor.name);
            remaining.sort(() => Math.random() - 0.5);
            currentOptions = [currentInkColor, ...remaining.slice(0, 3)];
            currentOptions.sort(() => Math.random() - 0.5);

            // Render Buttons
            optionsGrid.innerHTML = '';
            currentOptions.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-color-card flex items-center justify-between p-4 rounded-2xl font-black text-lg text-white border border-white/10 relative overflow-hidden';
                btn.style.backgroundColor = option.hex;
                
                // Add dark overlay gradient for readability
                btn.innerHTML = `
                    <span class="drop-shadow-md">${dn(option.name)}</span>
                    <span class="hidden md:inline-block key-badge px-2 py-0.5 rounded text-xs text-white/80 font-mono font-bold">${['Q','W','A','S'][idx]}</span>
                `;

                btn.onclick = () => handleChoice(option);
                optionsGrid.appendChild(btn);
            });

            // Start Timer
            const duration = DIFFICULTY_SETTINGS[currentDifficulty];
            startTime = Date.now();
            timerBar.style.width = '100%';
            timerBar.className = 'h-full bg-gradient-to-r from-emerald-400 to-cyan-400 w-full transition-all duration-75';

            timerId = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, duration - elapsed);
                const percent = (remaining / duration) * 100;

                timerBar.style.width = `${percent}%`;

                if (percent < 30) {
                    timerBar.className = 'h-full bg-gradient-to-r from-rose-500 to-red-600 w-full transition-all duration-75';
                }

                if (remaining <= 0) {
                    gameOver('timeout');
                }
            }, 30);
        }

        // Handle Player Choice
        function handleChoice(selectedOption) {
            if (!isPlaying) return;

            if (selectedOption.name === currentInkColor.name) {
                // Correct Choice
                score++;
                streak++;
                scoreDisplay.textContent = score;

                if (streak >= 3) {
                    streakCount.textContent = streak;
                    streakBadge.style.opacity = '1';
                }

                if (streak % 5 === 0) {
                    playSound('streak');
                } else {
                    playSound('correct');
                }

                nextTurn();
            } else {
                // Incorrect Choice
                gameOver('wrong');
            }
        }

        // Keyboard Controls (Desktop Support)
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    startGame();
                }
                return;
            }

            const keyMap = { 'KeyQ': 0, 'KeyW': 1, 'KeyA': 2, 'KeyS': 3 };
            if (e.code in keyMap) {
                const index = keyMap[e.code];
                if (currentOptions[index]) {
                    handleChoice(currentOptions[index]);
                }
            }
        });

            </script>

</body></html>
