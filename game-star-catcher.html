<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Catcher</title><style>
:root{--fs:22px;--ls:.04em;--bg:#fbf6ea;--ink:#2b3a3a;--acc:#3aa6a0;--soft:#e6f2ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,Tahoma,sans-serif;font-size:var(--fs);letter-spacing:var(--ls);line-height:1.7;display:flex;flex-direction:column;align-items:center;padding:14px;text-align:center;user-select:none}
h1{font-size:1.05em;margin:6px 0}#m{min-height:2.4em;color:#44706c}.btn{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:12px 22px;font-size:.9em;font-family:inherit;margin:8px}
.st{font-size:1.5em}.grid{display:grid;gap:12px;width:100%;max-width:420px;margin:10px auto}
.t{background:#fff;border:3px solid var(--soft);border-radius:20px;min-height:68px;font-size:1.5em;display:grid;place-items:center;cursor:pointer;transition:transform .25s,background .3s}.t.ok{background:#cdeedb;border-color:#6cc79a;transform:scale(.96)}.t.no{animation:soft .5s}.t.glow{border-color:#f2c14e;background:#fff7dc}
@keyframes soft{30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
body.calm *{animation:none!important;transition:none!important}
</style></head><body><h1>Star Catcher · صيّاد النجوم</h1><div id="m"></div>
<script>
const P=window.HOG||{lang:'en',calm:false,sound:false};const AR=P.lang==='ar';const T=(e,a)=>AR?a:e;if(P.calm)document.body.classList.add('calm');
const $=s=>document.querySelector(s);const say=t=>{$('#m').textContent=t};
const GOOD=AR?['أحسنت','رائع','جميل','ممتاز','استمر']:['Nice one','Lovely','Great','Well done','Keep going'];const good=()=>GOOD[Math.floor(Math.random()*GOOD.length)];
const done=(stars)=>{try{parent.postMessage({hogdone:'star-catcher',stars:stars},'*')}catch(e){}};
const ping=()=>{if(!P.sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}};

$('#m').insertAdjacentHTML('afterend','<canvas id="c" width="360" height="420" style="width:100%;max-width:360px;background:linear-gradient(#1d2f4f,#34507a);border-radius:22px;touch-action:none"></canvas><div class="st" id="sc"></div>');
const c=$('#c'),x=c.getContext('2d');let S=[],got=0,GOAL=8,miss=0,over=false;const sp=P.calm?.35:.7;
const mk=()=>({x:20+Math.random()*320,y:-20,v:sp+Math.random()*.4,gold:Math.random()<.45,r:18});
say(T('Tap the golden stars. Ignore the grey ones.','المس النجوم الذهبية فقط. تجاهل الرمادية.'));
setInterval(()=>{if(!over&&S.length<5)S.push(mk())},900);
function star(px,py,r,col){x.fillStyle=col;x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}x.closePath();x.fill()}
function loop(){x.clearRect(0,0,360,420);S.forEach(s=>{s.y+=s.v;star(s.x,s.y,s.r,s.gold?'#ffd45c':'#9aa5b5')});S=S.filter(s=>s.y<440);requestAnimationFrame(loop)}loop();
c.onpointerdown=e=>{if(over)return;const b=c.getBoundingClientRect(),px=(e.clientX-b.left)*360/b.width,py=(e.clientY-b.top)*420/b.height;const i=S.findIndex(s=>Math.hypot(s.x-px,s.y-py)<s.r+14);if(i<0)return;const s=S[i];S.splice(i,1);if(s.gold){got++;ping();$('#sc').textContent='⭐'.repeat(got);say(good());if(got>=GOAL){over=true;say(T('The sky is full of stars!','امتلأت السماء بالنجوم!'));$('#sc').insertAdjacentHTML('afterend','<button class="btn" onclick="location.reload()">'+T('Play again','العب مجددًا')+'</button>');done(3)}}else{say(T('That one is grey. Look for gold.','هذه رمادية. ابحث عن الذهبية.'))}};</script></body></html>
